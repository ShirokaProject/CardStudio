name: Release CardStudio

on:
  push:
    tags: ['**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools
      - name: Publish browser app
        run: dotnet publish src/Browser/CardStudio.Browser.csproj -c Release
      - name: Allow _framework files on Pages
        run: touch src/Browser/bin/Release/net10.0-browser/publish/wwwroot/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: src/Browser/bin/Release/net10.0-browser/publish/wwwroot
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src/Browser/bin/Release/net10.0-browser/publish/wwwroot
          zip -qr "$RUNNER_TEMP/CardStudio-web-${GITHUB_REF_NAME}.zip" .
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/CardStudio-web-${GITHUB_REF_NAME}.zip" \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
