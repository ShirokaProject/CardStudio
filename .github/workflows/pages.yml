name: Release CardStudio

on:
  push:
    tags: ['**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  desktop:
    name: Desktop ${{ matrix.rid }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        rid: [win-x64, win-arm64, linux-x64, linux-arm64, linux-musl-x64, linux-musl-arm64, osx-x64, osx-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish single-file app
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          output="$RUNNER_TEMP/publish"
          dotnet publish src/Desktop/CardStudio.Desktop.csproj -c Release -r "$rid" \
            --self-contained true -o "$output" \
            -p:PublishSingleFile=true -p:PublishTrimmed=false \
            -p:DebugType=None -p:DebugSymbols=false
          extension=""
          if [[ "$rid" == win-* ]]; then extension=".exe"; fi
          mkdir -p "$RUNNER_TEMP/release"
          install -m 755 "$output/CardStudio.Desktop$extension" \
            "$RUNNER_TEMP/release/CardStudio-$rid$extension"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 1

  browser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools
      - name: Publish browser app
        run: dotnet publish src/Browser/CardStudio.Browser.csproj -c Release
      - name: Allow _framework files on Pages
        run: touch src/Browser/bin/Release/net10.0-browser/publish/wwwroot/.nojekyll
      - name: Package browser app
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          cd src/Browser/bin/Release/net10.0-browser/publish/wwwroot
          zip -qr "$RUNNER_TEMP/release/CardStudio-web-${GITHUB_REF_NAME}.zip" .
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: src/Browser/bin/Release/net10.0-browser/publish/wwwroot

  deploy:
    needs: browser
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    needs: [desktop, browser, deploy]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP/release/"* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --generate-notes --verify-tag
