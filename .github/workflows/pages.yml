name: Deploy WASM to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - src/**
      - CardStudio.slnx
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Install WebAssembly tools
        run: dotnet workload install wasm-tools
      - name: Publish browser app
        run: dotnet publish src/Browser/CardStudio.Browser.csproj -c Release
      - name: Allow _framework files on Pages
        run: touch src/Browser/bin/Release/net10.0-browser/publish/wwwroot/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: src/Browser/bin/Release/net10.0-browser/publish/wwwroot
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
